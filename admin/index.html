:root{--bg:#eef3f0;--card:#fff;--ink:#1c2b27;--mute:#64766f;--line:#d5e0db;--main:#1f6f5c;--main-ink:#fff;--soft:#dcefe8;--off:#e8ecea;--bad:#b3402a;--bad-bg:#fbe6e1;--ok:#1f6f5c;--wait:#8a5a00;--wait-bg:#fdf0d0;

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.5}
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top>div{max-width:960px;margin:0 auto;padding:12px 16px 12px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:40px;height:40px;flex:none;border-radius:50%;background:#fff}
.brand b{display:block;line-height:1.25}.brand small{color:var(--mute)}
.navb{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.navb>div{max-width:560px;margin:0 auto;display:flex}
.navb button{position:relative;flex:1;font:inherit;font-size:.72rem;line-height:1.2;border:0;background:transparent;color:var(--mute);padding:8px 2px 7px;cursor:pointer}
.navb button span{display:block;font-size:1.2rem;line-height:1.3}.navb button.on{color:var(--main);font-weight:700}
.navb .bdg{position:absolute;top:2px;right:calc(50% - 26px);min-width:18px;height:18px;border-radius:99px;background:#d64545;color:#fff;font-size:.72rem;display:grid;place-items:center;padding:0 5px;font-style:normal}
.subtabs.mgb{flex-wrap:wrap;overflow-x:visible}.lgo{margin-left:auto;font:inherit;font-size:.9rem;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer}
main{max-width:960px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:1.3rem;margin:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:14px}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row:last-child{border:0}.row small{color:var(--mute);display:block}.row>div:first-child{flex:1;min-width:180px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{font:inherit;font-size:.9rem;border-radius:10px;padding:8px 12px;border:2px solid var(--main);background:var(--main);color:var(--main-ink);cursor:pointer;font-weight:700}
.btn.g{background:transparent;color:var(--main)}.btn.d{background:transparent;color:var(--bad);border-color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.tag{font-size:.8rem;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--ok);white-space:nowrap;font-weight:500}
.nf{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.nf button{font:inherit;font-size:.9rem;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer}.nf button.on{background:var(--soft);border-color:var(--main);font-weight:700}
.tag.w{background:var(--wait-bg);color:var(--wait)}.tag.b{background:var(--bad-bg);color:var(--bad)}.tag.o{background:var(--off);color:var(--mute)}
.form{padding:14px;margin-bottom:14px;display:grid;gap:10px}
.form label{font-size:.9rem;color:var(--mute);display:block;margin-bottom:4px}
.in{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dchk{display:flex;gap:6px;flex-wrap:wrap}
.dchk label{margin:0;display:flex;align-items:center;gap:4px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
.form .ck{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:1rem;margin:0}
.ck input{width:20px;height:20px}
textarea.in{resize:vertical}
.saved{background:var(--soft);color:var(--ok);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:700}
[hidden]{display:none!important}.savebar{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 6px;border-top:1px solid var(--line);margin-top:6px}.subtabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.subtabs button{flex:none;font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;cursor:pointer}
.subtabs button.on{background:var(--main);color:var(--main-ink);border-color:var(--main);font-weight:700}
.hint2{color:var(--mute);font-size:.9rem;margin:0 0 12px}
.pinbox{border:2px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.pinok{margin:0;color:var(--ok);font-weight:500}
a{color:var(--main)}

.pimgrow{display:flex;gap:12px;align-items:center}.pimgrow input{flex:1;min-width:0}
.srch{margin-bottom:12px}
.sdl{display:grid;gap:8px}.sdr{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 10px}.sdr .ck{margin:0}.sdn{color:var(--mute);margin-left:6px}
.sdd{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.dyb{font:inherit;min-width:42px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;padding:0 8px}
.dyb.on{background:var(--main);color:var(--main-ink);border-color:var(--main);font-weight:700}.dyb:disabled{opacity:.4;cursor:not-allowed}.dyb.all{font-size:.85rem;color:var(--main);border-color:var(--main);background:transparent}.dyb:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.slipth{max-height:130px;max-width:100%;border-radius:8px;border:2px solid var(--line);display:block;margin:6px 0;background:#fff}.slipbig{max-width:100%;border-radius:10px;border:2px solid var(--line);display:block;margin:8px 0;background:#fff}.slipbtn{background:none;border:0;padding:0;cursor:zoom-in}
.qrbox{display:grid;place-items:center;min-height:210px;padding:10px;background:#fff;border-radius:12px;margin:8px 0}.qrbox small{color:#555;text-align:center}
.empty{padding:20px 0;color:var(--mute);text-align:center}
.agate{max-width:420px;margin:24px auto}.agate h1{font-size:1.4rem;margin:0 0 4px}.asub{color:var(--mute);margin:0 0 14px}.agl{display:block;margin:0 0 10px}.agl span{display:block;margin-bottom:4px;font-weight:600}
.aerr{color:var(--bad);font-weight:600;margin:4px 0 10px;min-height:1.4em}.awide{width:100%;padding:12px}.alinks{display:flex;gap:10px;margin-top:12px}.aok{background:var(--soft);color:var(--main);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.licimg{display:block;max-width:100%;max-height:420px;margin-top:8px;border-radius:8px;border:2px solid var(--line);background:#fff}.err{font-weight:600}
.mpov{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}.mpov header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line)}.mpov header b{font-size:1.05rem}.mpx{font:inherit;min-width:44px;min-height:44px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer}.mpm{flex:1;min-height:200px;position:relative;background:var(--off)}.mpm .mpe{padding:16px;color:var(--mute)}.mpc{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:8px;background:var(--bg)}.mpn{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.mpn button,.mpc .mpb{font:inherit;min-height:44px;min-width:44px;padding:6px 12px;border:2px solid var(--main);border-radius:10px;background:transparent;color:var(--main);cursor:pointer}.mpc .mpb.pri{background:var(--main);color:var(--main-ink)}.mpc input{font:inherit;min-height:44px;width:100%;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card);color:var(--ink)}.mpg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mpa{display:flex;gap:8px}.mpa .mpb{flex:1}.mpin{font-size:28px;line-height:30px;text-align:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
