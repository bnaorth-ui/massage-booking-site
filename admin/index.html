 if(st==="login")h=card("เข้าสู่ระบบแอดมิน","เข้าใช้งานด้วยเบอร์มือถือและรหัสผ่าน",afld("aph","เบอร์มือถือ","tel",'inputmode="tel" autocomplete="username"')+afld("apw","รหัสผ่าน","password",'autocomplete="current-password"')+btn("เข้าสู่ระบบ"),'<div class="alinks"><button class="btn g" data-ag="fp">ลืมรหัสผ่าน</button></div>');
 if(st==="fp")h='<div class="agate"><h1>ลืมรหัสผ่าน</h1><p class="asub">ยังไม่มีการส่ง SMS รีเซ็ตรหัสผ่านอัตโนมัติ ให้แอดมินคนอื่นช่วยตั้งรหัสผ่านใหม่ให้ที่ Supabase &gt; Authentication &gt; Users (เลือกผู้ใช้ แล้วตั้งรหัสผ่านใหม่)</p><div class="alinks"><button class="btn g" data-ag="login">กลับไปเข้าสู่ระบบ</button></div></div>';
 if(st==="denied")h='<div class="agate"><h1>ไม่มีสิทธิ์แอดมิน</h1><p class="asub">บัญชีนี้เข้าสู่ระบบได้ แต่ยังไม่อยู่ในรายชื่อแอดมิน ให้แอดมินคนเดิมเพิ่มสิทธิ์ให้ในเมนู การตั้งค่า &gt; แอดมิน</p><div class="alinks"><button class="btn g" data-ag="logout">ออกจากระบบ</button></div></div>';
 if(st==="loaderr")h='<div class="agate"><h1>โหลดข้อมูลไม่สำเร็จ</h1><p class="aerr" role="alert">'+esc(AG.err)+'</p><div class="alinks"><button class="btn" data-ag="retry">ลองใหม่</button><button class="btn g" data-ag="logout">ออกจากระบบ</button></div></div>';
 m.innerHTML=h;AG.ok="";
 document.querySelectorAll("[data-ag]").forEach(function(e){e.onclick=function(){var a=e.dataset.ag;AG.err="";if(a==="logout"){doLogout();return}if(a==="retry"){enter();return}AG.step=a;gateDraw()}});

function gerr(t){AG.err=t;var e=document.getElementById("aerr");if(e)e.textContent=t}

function gateSubmit(st){if(S.busy)return;
 if(st==="login"){var ph=phoneN(gv("aph")),pw=gv("apw"),now=Date.now();
  if(now<AG.lock){gerr("กรอกผิดหลายครั้ง กรุณารอ "+Math.ceil((AG.lock-now)/1000)+" วินาที แล้วลองใหม่");return}
  if(!ph||!pw){gerr("กรอกเบอร์มือถือและรหัสผ่าน");return}
  S.busy=true;gerr("");
  sbReq("/auth/v1/token?grant_type=password",{method:"POST",json:1,auth:false,body:JSON.stringify({email:sbEmail(ph),password:pw})}).then(sbSet).then(function(){S.busy=false;AG.fail=0;return enter()})
   .catch(function(e){S.busy=false;if(e.code==="invalid_credentials"||/invalid login/i.test(e.message||"")){AG.fail++;if(AG.fail>=5){AG.fail=0;AG.lock=Date.now()+30000;gerr("กรอกผิด 5 ครั้ง ระบบล็อก 30 วินาที");return}}gerr(errTh(e,"เข้าสู่ระบบไม่สำเร็จ"))});return}
 if(st==="setup"){var n=gv("sn").trim(),p=phoneN(gv("sph")),w=gv("spw");
  if(!n){gerr("กรอกชื่อ-นามสกุล");return}if(!/^0\d{9}$/.test(p)){gerr("กรอกเบอร์มือถือ 10 หลักให้ถูกต้อง (เช่น 0812345678)");return}
  if(w.length<8){gerr("รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร");return}if(w!==gv("spw2")){gerr("รหัสผ่านทั้งสองช่องไม่ตรงกัน");return}
  S.busy=true;gerr("");
  sbReq("/auth/v1/signup",{method:"POST",json:1,auth:false,body:JSON.stringify({email:sbEmail(p),password:w,data:{first_name:n,last_name:"",phone:p}})}).then(function(j){if(!j||!j.access_token){var e1=new Error("nc");e1.code="email_not_confirmed";throw e1}sbSet(j)},function(e){
    if(e.code==="user_already_exists"||/already (registered|exists)/i.test(e.message||""))return sbReq("/auth/v1/token?grant_type=password",{method:"POST",json:1,auth:false,body:JSON.stringify({email:sbEmail(p),password:w})}).then(sbSet,function(){var x=new Error("เบอร์นี้มีบัญชีอยู่แล้ว ใส่รหัสผ่านเดิมของบัญชีนั้น");x.code="P0001";throw x});throw e})
   .then(function(){return rpc("claim_first_admin")}).then(function(){S.busy=false;return enter()})
   .catch(function(e){S.busy=false;gerr(errTh(e,"สร้างบัญชีไม่สำเร็จ"))})}}
