<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จองนวดออนไลน์</title>

<style>
:root{--tb:62px;--bg:#eef3f0;--card:#fff;--ink:#1c2b27;--mute:#64766f;--line:#d5e0db;--main:#1f6f5c;--main-ink:#fff;--soft:#dcefe8;--off:#e8ecea;--bad:#b3402a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a17;--card:#192823;--ink:#e6f0ec;--mute:#93a8a0;--line:#2b3f38;--main:#4cc2a1;--main-ink:#07211a;--soft:#1e3a31;--off:#223530;--bad:#f0907c}}
:root[data-theme="dark"]{--bg:#101a17;--card:#192823;--ink:#e6f0ec;--mute:#93a8a0;--line:#2b3f38;--main:#4cc2a1;--main-ink:#07211a;--soft:#1e3a31;--off:#223530;--bad:#f0907c}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.5}
.top{max-width:480px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;flex:none;border-radius:50%;background:#fff}
.brand{font-weight:700;font-size:1.05rem;line-height:1.3}
.app{max-width:480px;margin:0 auto;padding:12px 16px 170px}
h1{font-size:1.4rem;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 14px;font-size:.95rem}
.list{display:grid;gap:10px}
.opt{width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--main)}
.opt.sel{border-color:var(--main);background:var(--soft)}
.opt:disabled{background:var(--off);color:var(--mute);cursor:not-allowed}.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.pr{display:flex;gap:8px;align-items:center;margin-top:6px}.pr img{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none}.ico img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}.ico{overflow:hidden;font-size:1.6rem;width:48px;height:48px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
.opt>span:nth-child(2){flex:1}
.opt b{display:block}.opt small{color:var(--mute)}
.price{font-weight:700;white-space:nowrap}
.fl{display:block;font-size:.9rem;color:var(--mute);margin:14px 0 6px}
.sel{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 12px}
.sel:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.sel:disabled{background:var(--off);color:var(--mute)}
.note{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:.9rem;margin:0 0 4px}
.sum{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px 16px}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0;font-weight:700;font-size:1.1rem}
.row span:first-child{color:var(--mute)}.row:last-child span:first-child{color:var(--ink)}
.row span:last-child{text-align:right}
.stl{font-weight:700;margin:18px 0 8px}
.msg{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.msg .mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.msg pre{margin:0;font:inherit;white-space:pre-wrap;color:var(--ink);font-size:.95rem}
.tag{font-size:.8rem;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--main);white-space:nowrap}
.done .sub{margin-bottom:14px}
.qs{display:flex;align-items:center;gap:6px;flex:none;margin-left:8px}.qb{width:38px;height:38px;border-radius:50%;border:2px solid var(--main);background:var(--card);color:var(--main);font:inherit;font-size:1.3rem;font-weight:700;cursor:pointer;line-height:1;padding:0}.qb:disabled{opacity:.35;cursor:not-allowed}.qb:focus-visible{outline:3px solid var(--main);outline-offset:2px}.qn{min-width:22px;text-align:center;font-weight:700}
.ck2{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;cursor:pointer}.ck2 input{width:22px;height:22px;margin-top:2px;flex:none}.ck2 small{display:block;color:var(--mute)}
.svr{cursor:default}
.mt2{color:var(--mute);font-size:.9rem;margin:-4px 0 8px}
.promo{background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:.92rem}.promo small{display:block;color:var(--ink)}
.err{background:#fbe6e1;color:#b3402a;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.92rem}
.card2{margin:0 0 12px}
.chh{margin:0 0 6px}.chh .btn{width:auto;padding:8px 14px}.chl{display:flex;flex-direction:column;gap:8px;margin:10px 0 90px}.msg{max-width:85%;border-radius:14px;padding:8px 12px;border:2px solid var(--line);background:var(--card)}.msg.mine{align-self:flex-end;background:var(--soft,#dcefe8)}.msg small{display:block;opacity:.8}.msg p{margin:2px 0 0;white-space:normal;overflow-wrap:anywhere}.chf{position:sticky;bottom:var(--nbh,0px);display:flex;gap:8px;align-items:flex-end;background:var(--bg);padding:10px 0;border-top:1px solid var(--line)}.chf textarea{flex:1;margin:0;resize:none}.chf .btn{width:auto;margin:0;padding:10px 18px}.cn{display:inline-block;min-width:22px;border-radius:99px;background:#d64545;color:#fff;font-size:.8rem;padding:0 6px;margin-left:6px}.chb{flex-wrap:wrap}.chb .btn{min-width:140px}
.btn.dgr{background:var(--bad);border-color:var(--bad);color:var(--card)}.btn.dgr.ghost{background:transparent;color:var(--bad)}.pv h2.stl{margin:16px 0 4px}.pvl{margin:4px 0;padding-left:22px}.pvl li{padding:3px 0}.rtl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-4px 0 10px;padding:0 4px}.rtl .sc{font-weight:700}.rtl .lb{margin-left:auto}.tag.nw{background:#fff3cd;color:#6b4e00}.rvh .btn{width:auto;padding:8px 14px}.rvs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}.rvs button{font:inherit;min-height:44px;padding:6px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer}.rvs button[aria-pressed=true]{border-color:var(--main);background:var(--soft);font-weight:700}.rvb{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}.rvb h2{font-size:1.05rem;margin:0 0 4px}.rv{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}.rv p{margin:6px 0 0;overflow-wrap:anywhere}.rv .rp{border-left:4px solid var(--main);padding-left:10px;color:var(--ink)}.rvavg{font-size:1.4rem;font-weight:700;margin:6px 0}.ptsbox{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}.ptsbox b{display:block}.ptsbox p{margin:6px 0}.ptsn b{display:inline;font-size:2rem}.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700}.chk input{width:24px;height:24px}.ptsl{margin:10px 0 0;padding-left:20px}.ptsl li{padding:4px 0}
.inbtns{display:flex;gap:10px;margin-top:16px}.inbtns .btn{margin:0}
.mbtns a.btn{flex:1;margin:0;padding:10px;text-align:center;text-decoration:none;display:block}
.ct{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}.ct b{display:block;font-size:1.1rem}.ct p{margin:4px 0 0;color:var(--mute);white-space:pre-line}.ct .hr{display:block;white-space:pre-line;margin-top:6px}a.cta{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:700;background:var(--main);color:var(--main-ink);border:2px solid var(--main);border-radius:12px;padding:16px;margin:0 0 10px}a.cta.line{background:#06c755;border-color:#06c755;color:#fff}a.cta.reg{background:transparent;color:var(--main)}a.cta span{font-size:1.6rem}a.cta small{display:block;font-weight:400;opacity:.9}a.cta:focus-visible{outline:3px solid var(--main);outline-offset:2px}


.bdg{position:absolute;top:6px;right:8px;min-width:22px;height:22px;border-radius:99px;background:#d64545;color:#fff;font-style:normal;font-size:.8rem;display:grid;place-items:center;padding:0 6px}.bdg.b2{background:var(--main);color:var(--main-ink)}
.bk{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}.bk small{display:block;color:var(--mute)}.bk .qh{margin-bottom:2px}
.mbtns{display:flex;gap:8px;margin-top:10px}.mbtns .btn{flex:1;margin:0;padding:10px}
.btn.dng{background:transparent;color:var(--bad);border-color:var(--bad)}
.mv{background:var(--soft);border:2px solid var(--main);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:.92rem}.mv .lb{margin-top:8px;display:block}
.flash{background:var(--soft);color:var(--main);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:700}
.msg .mt{color:var(--mute);display:block;margin-bottom:4px}
.loc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.92rem;margin:0 0 10px}
.lb{font:inherit;font-size:.85rem;color:var(--main);background:transparent;border:2px solid var(--main);border-radius:99px;padding:5px 12px;cursor:pointer}
.tg{display:flex;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.tg button{flex:1;font:inherit;color:var(--ink);background:transparent;border:0;border-radius:9px;padding:10px 4px;cursor:pointer}
.tg button.on{background:var(--main);color:var(--main-ink);font-weight:700}.tg button:focus-visible,.lb:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.empty{padding:20px 0;color:var(--mute);text-align:center}
.cath{font-size:1rem;margin:18px 0 8px;color:var(--mute)}
.ann{background:var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:.92rem}

.hint{font-size:.9rem;color:var(--mute);margin:10px 0 0}
.bar{position:fixed;left:0;right:0;bottom:calc(var(--tb) + 2px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);padding:12px 16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:2px solid var(--line);padding:0 0 env(safe-area-inset-bottom,0px)}.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}.tabs button{position:relative;font:inherit;background:none;border:0;color:var(--mute);height:var(--tb);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0}.tabs button span{font-size:1.45rem;line-height:1}.tabs button b{font-size:.8rem;font-weight:700}.tabs button.on{color:var(--main)}.tabs button.on b{text-decoration:underline;text-underline-offset:3px}.tabs button:focus-visible{outline:3px solid var(--main);outline-offset:-3px}.tabs .bdg{position:absolute;top:6px;left:calc(50% + 8px);margin:0}
.bar div{max-width:480px;margin:0 auto;display:flex;gap:10px}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:14px;border:2px solid var(--main);cursor:pointer;flex:1;background:var(--main);color:var(--main-ink)}
.btn.ghost{background:transparent;color:var(--main);flex:0 0 36%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.done{text-align:center;padding-top:28px}
.done .ico{width:84px;height:84px;font-size:2.6rem;margin:0 auto 12px}
.ref{font-weight:700;letter-spacing:.06em}
.prof{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}.prof .pi{flex:1;min-width:0;display:flex;flex-direction:column}.prof .pi b,.prof .pi small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prof small{color:var(--mute)}
.av{width:44px;height:44px;flex:none;border-radius:50%;object-fit:cover;background:var(--soft);color:var(--main);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2rem}.chg{color:var(--main);font-size:.9rem;font-weight:700;text-decoration:underline;cursor:pointer;margin-top:2px}.chg:focus-within,.prof:focus-within .chg{outline:3px solid var(--main);outline-offset:2px}.pmsg{color:var(--main)}
.av.big{width:84px;height:84px;font-size:2rem}
.avrow{display:flex;align-items:center;gap:14px;margin:0 0 12px}.avbtn{display:inline-block;cursor:pointer}.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.vh:focus-visible+*,.avrow:focus-within .avbtn{outline:3px solid var(--main);outline-offset:2px}
.fld{display:block;margin:0 0 10px}.fld span{display:block;margin-bottom:4px;font-weight:600}
.aerr{color:var(--bad);font-weight:600;margin:4px 0 10px;min-height:1.4em}.btn.wide{width:100%;flex:none}
.alinks{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;margin-top:14px}
.codebox{background:var(--soft);border-radius:14px;padding:12px 14px;margin:6px 0 14px;text-align:center}.codebox b{display:block;font-size:2rem;letter-spacing:.2em}.codebox small{color:var(--mute)}
</style>
</head>

 var S2=function(t,b){return '<h2 class="stl">'+t+'</h2>'+b},L=function(a){return '<ul class="pvl">'+a.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ul>'};
 return '<div class="pv"><p>'+esc(nm)+' เป็นผู้ดูแลข้อมูลของคุณในระบบจองคิวนวดนี้</p>'+
  S2("เราเก็บข้อมูลอะไร",L(["ชื่อ เบอร์โทรศัพท์ และรูปโปรไฟล์ (ถ้าคุณเพิ่ม)","รายการจอง แต้มสะสม ข้อความแชต และรีวิวที่คุณเขียน","ตำแหน่งโดยประมาณ เก็บเฉพาะเมื่อคุณกดอนุญาต"]))+
  S2("เราใช้ข้อมูลทำอะไร",L(["ให้คุณจองคิว ยกเลิก เลื่อนคิว และคุยกับร้านหรือพนักงาน","แสดงร้านที่อยู่ใกล้ และแจ้งเตือนเรื่องการจอง โปรโมชั่น หรือร้านใหม่ใกล้คุณ","คำนวณแต้มสะสม และตรวจสอบรีวิวที่ถูกแจ้ง"]))+
  S2("ใครเห็นข้อมูลของคุณ",L(["ร้านและพนักงานที่คุณจอง เห็นชื่อ เบอร์โทร และรายละเอียดของการจองนั้น","รีวิวของคุณแสดงเฉพาะชื่อต้น","ผู้ดูแลของสมาคมเห็นข้อมูลเท่าที่จำเป็นต่อการดูแลระบบ","เราไม่ขายข้อมูลของคุณให้ใคร"]))+
  S2("เราเก็บนานแค่ไหน",L(["ชื่อและเบอร์โทรในรายการจองถูกลบหลังการใช้บริการผ่านไป 12 เดือน","ข้อความแชตถูกลบอัตโนมัติหลัง 90 วัน","เมื่อคุณลบบัญชี โปรไฟล์ รูป แต้มสะสม การแจ้งเตือน และข้อความแชตที่คุณส่งจะถูกลบทันที รายการจองจะถูกล้างชื่อและเบอร์โทร","ข้อมูลอื่นเก็บไว้ตราบที่บัญชียังอยู่"]))+
  S2("สิทธิ์ของคุณ",L(["ปิดการใช้ตำแหน่งได้ทุกเมื่อ (ปุ่ม &quot;ไม่ใช้ตำแหน่ง&quot; หน้าเลือกร้าน)","ลบบัญชีและข้อมูลของคุณได้เองที่ปุ่ม &quot;ลบบัญชีของฉัน&quot; ในหน้าบัญชี (ต้องไม่มีการจองที่ยังไม่เสร็จสิ้น)","ขอดูหรือแก้ไขข้อมูลได้โดยติดต่อสมาคม"]))+
  S2("ติดต่อเรา",'<p>'+esc(nm)+(tel?' โทร '+esc(tel):' (เบอร์โทรดูได้ที่หน้าบัญชี หลังเข้าสู่ระบบ)')+'</p>')+'</div>'}
function authRender(){var tb=document.getElementById("tabs");if(tb)tb.style.display="none";
 var a=document.getElementById("app"),b=document.getElementById("bar"),h="",st=AU.step;b.innerHTML="";b.style.display="none";
 if(AU.loading){a.innerHTML='<p class="sub" role="status">กำลังตรวจสอบการเข้าสู่ระบบ…</p>';return}
 if(st==="login"){
  h='<h1>เข้าสู่ระบบ</h1><p class="sub">เข้าใช้งานด้วยเบอร์มือถือและรหัสผ่าน</p>'+(AU.ok?'<div class="flash" role="status">'+esc(AU.ok)+'</div>':'')+
  '<form id="authf" novalidate>'+fld("lph","เบอร์มือถือ","tel",'inputmode="tel" autocomplete="tel" placeholder="เช่น 0812345678"')+fld("lpw","รหัสผ่าน","password",'autocomplete="current-password"')+
  '<p class="aerr" id="aerr" role="alert"></p><button class="btn wide" type="submit">เข้าสู่ระบบ</button></form>'+
  '<div class="alinks"><button class="lb" data-ag="fp">ลืมรหัสผ่าน</button><button class="lb" data-ag="reg">ลงทะเบียนสมาชิกใหม่</button><button class="lb" data-ag="pv">นโยบายความเป็นส่วนตัว</button></div>'}
 if(st==="reg"){
  h='<h1>ลงทะเบียนสมาชิกใหม่</h1><p class="sub">กรอกข้อมูลเพื่อสร้างบัญชีผู้ใช้งาน</p>'+
  '<form id="authf" novalidate><div class="avrow"><span id="avprev">'+avHtml({fn:"?",img:AU.img},true)+'</span><label class="lb avbtn" for="rimg">เลือกรูปโปรไฟล์</label><input id="rimg" type="file" accept="image/*" class="vh"></div>'+
  fld("rfn","ชื่อ","text",'autocomplete="given-name"')+fld("rln","นามสกุล","text",'autocomplete="family-name"')+fld("rph","เบอร์มือถือ","tel",'inputmode="tel" autocomplete="tel" placeholder="เช่น 0812345678"')+
  fld("rpw","รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)","password",'autocomplete="new-password"')+fld("rpw2","ยืนยันรหัสผ่าน","password",'autocomplete="new-password"')+
  '<label class="chk" for="rpv"><input type="checkbox" id="rpv"> ฉันได้อ่านและยอมรับนโยบายความเป็นส่วนตัว</label><div class="alinks"><button type="button" class="lb" data-ag="pv">อ่านนโยบายความเป็นส่วนตัว</button></div>'+
  '<p class="aerr" id="aerr" role="alert"></p><button class="btn wide" type="submit">ลงทะเบียน</button></form>'+
  '<div class="alinks"><button class="lb" data-ag="login">มีบัญชีแล้ว? เข้าสู่ระบบ</button></div>'}
 if(st==="pv"){
  h='<div class="alinks"><button class="lb" data-ag="'+(AU.pvBack==="reg"?"reg":"login")+'">← กลับ</button></div><h1 id="pvt" tabindex="-1">นโยบายความเป็นส่วนตัว</h1>'+pvHtml()}
 if(st==="fp"){
  h='<h1>ลืมรหัสผ่าน</h1><div class="codebox">การรีเซ็ตรหัสผ่านอัตโนมัติด้วย SMS ยังไม่เปิดให้บริการ<small>กรุณาติดต่อสมาคมวิทยากรฝึกอาชีพคนตาบอด เพื่อให้เจ้าหน้าที่ช่วยตั้งรหัสผ่านใหม่ให้</small></div>'+
  '<div class="alinks"><button class="lb" data-ag="login">กลับไปเข้าสู่ระบบ</button></div>'}
 a.innerHTML=h;window.scrollTo(0,0);AU.ok="";
 var g=function(i){return document.getElementById(i)},er=function(t){g("aerr").textContent=t},v=function(i){return g(i).value};
 document.querySelectorAll("[data-ag]").forEach(function(e){e.onclick=function(){var nx=e.dataset.ag;if(nx==="pv"){AU.pvBack=AU.step;if(AU.step==="reg"){AU.draft={rfn:v("rfn"),rln:v("rln"),rph:v("rph"),rpv:g("rpv").checked}}}else if(AU.step==="pv"&&nx==="reg"){}else AU.draft=null;AU.step=nx;if(nx==="login"||nx==="fp")AU.img=null;authRender();if(nx==="pv"){var t=document.getElementById("pvt");if(t)t.focus()}}});
 if(st==="reg"&&AU.draft){["rfn","rln","rph"].forEach(function(i){g(i).value=AU.draft[i]||""});g("rpv").checked=!!AU.draft.rpv;AU.draft=null}
 var f=g("authf");if(!f)return;
 if(st==="reg"){g("rimg").onchange=function(){var fl=this.files&&this.files[0];if(!fl)return;if(!/^image\//.test(fl.type)){er("เลือกไฟล์รูปภาพเท่านั้น");return}
   fitAv(fl,function(d){AU.img=d;g("avprev").innerHTML=avHtml({fn:"?",img:d},true);er("")},function(){er("อ่านรูปไม่สำเร็จ ลองเลือกรูปอื่น")})}}
 var busy=function(on){var bt=f.querySelector("button[type=submit]");if(bt)bt.disabled=on};
 var enter=function(){return loadProfile().then(function(u){setMe(u);S=fresh();startApp()})};
 f.onsubmit=function(ev){ev.preventDefault();
  if(st==="login"){var ph=normPhone(v("lph")),pw=v("lpw"),now=Date.now();
   if(now<AU.lock){er("กรอกผิดหลายครั้ง กรุณารอ "+Math.ceil((AU.lock-now)/1000)+" วินาที แล้วลองใหม่");return}
   if(!ph||!pw){er("กรอกเบอร์มือถือและรหัสผ่าน");return}
   busy(true);er("");
   sbReq("/auth/v1/token?grant_type=password",{method:"POST",json:1,auth:false,body:JSON.stringify({email:sbEmail(ph),password:pw})}).then(sbSet).then(function(){AU.fail=0;return enter()})
   .catch(function(e){busy(false);if(e.code==="invalid_credentials"||/invalid login/i.test(e.message||"")){AU.fail++;if(AU.fail>=5){AU.fail=0;AU.lock=Date.now()+30000;er("กรอกผิด 5 ครั้ง ระบบล็อก 30 วินาที");return}}er(errTh(e,"เข้าสู่ระบบไม่สำเร็จ"))});return}
  if(st==="reg"){var fn=v("rfn").trim(),ln=v("rln").trim(),p=normPhone(v("rph")),w=v("rpw"),w2=v("rpw2");
   if(!fn||!ln){er("กรอกชื่อและนามสกุล");return}
   if(!/^0\d{8,9}$/.test(p)){er("กรอกเบอร์มือถือให้ถูกต้อง (เช่น 0812345678)");return}
   if(w.length<6){er("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร");return}
   if(w!==w2){er("รหัสผ่านทั้งสองช่องไม่ตรงกัน");return}
   if(!g("rpv").checked){er("กรุณาติ๊กยอมรับนโยบายความเป็นส่วนตัวก่อนลงทะเบียน");g("rpv").focus();return}
   busy(true);er("");var img=AU.img;
   sbReq("/auth/v1/signup",{method:"POST",json:1,auth:false,body:JSON.stringify({email:sbEmail(p),password:w,data:{first_name:fn,last_name:ln,phone:p}})}).then(function(j){
     if(!j||!j.access_token){var e=new Error("not confirmed");e.code="email_not_confirmed";throw e}
     sbSet(j);
     if(!img)return;
     var path=j.user.id+"/avatar-"+Date.now()+".jpg";
     return fetch(img).then(function(r){return r.blob()}).then(function(bl){return sbReq("/storage/v1/object/avatars/"+path,{method:"POST",body:bl,headers:{"Content-Type":"image/jpeg","x-upsert":"true"}})})
      .then(function(){return sbReq("/rest/v1/profiles?id=eq."+j.user.id,{method:"PATCH",json:1,headers:{Prefer:"return=minimal"},body:JSON.stringify({avatar_path:path})})})
      .catch(function(){/* รูปอัปโหลดไม่สำเร็จ: สมัครสำเร็จแล้ว เพิ่มรูปภายหลังได้ */})
   }).then(function(){AU.img=null;return enter()}).catch(function(e){busy(false);er(errTh(e,"ลงทะเบียนไม่สำเร็จ"))})}}
}
function logout(){if(window.Push)Push.beforeLogout();var tk=SBS&&SBS.access_token;if(tk)sbReq("/auth/v1/logout",{method:"POST"}).catch(function(){});sbSave(null);setMe(null);CAT.state="idle";BK=[];NOTES=[];BUSY={};V.cfm=null;V.flash="";V.moving=null;V.moveItems=[];AU.step="login";S=fresh();authRender()}
SBS=rd(SSK,null);
if(SBS&&SBS.refresh_token){AU.loading=true;authRender();
 sbEnsure().then(loadProfile).then(function(u){AU.loading=false;setMe(u);S=fresh();startApp()}).catch(function(e){AU.loading=false;if(e.message!=="NET")sbSave(null);AU.step="login";authRender();if(e.message==="NET"){var x=document.getElementById("aerr");if(x)x.textContent=errTh(e)}})}
nearbyCheck();
render();
autoWatch();
</script>
