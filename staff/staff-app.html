 if(st==="login"){var ph=phoneN(gv("lph")),pw=gv("lpw"),now=Date.now();
  if(now<AG.lock){gerr("กรอกผิดหลายครั้ง กรุณารอ "+Math.ceil((AG.lock-now)/1000)+" วินาที แล้วลองใหม่");return}
  if(!/^0\d{9}$/.test(ph)||!pw){gerr("กรอกเบอร์มือถือ 10 หลักและรหัสผ่าน");return}
  busy(true);gerr("");
  sbReq("/auth/v1/token?grant_type=password",{method:"POST",json:1,auth:false,body:JSON.stringify({email:sbEmail(ph),password:pw})}).then(sbSet).then(function(){busy(false);AG.fail=0;return enter()})
   .catch(function(e){busy(false);if(e.code==="invalid_credentials"||/invalid login/i.test(e.message||"")){AG.fail++;if(AG.fail>=5){AG.fail=0;AG.lock=Date.now()+30000;gerr("กรอกผิด 5 ครั้ง ระบบล็อก 30 วินาที");return}}gerr(errTh(e,"เข้าสู่ระบบไม่สำเร็จ"))});return}
 if(st==="reg"){var fn=gv("rfn").trim(),ln=gv("rln").trim(),p=phoneN(gv("rph")),w=gv("rpw");
  if(!fn){gerr("กรอกชื่อ");return}if(!/^0\d{9}$/.test(p)){gerr("กรอกเบอร์มือถือ 10 หลักให้ถูกต้อง (เช่น 0812345678)");return}
  if(w.length<6){gerr("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร");return}if(w!==gv("rpw2")){gerr("รหัสผ่านทั้งสองช่องไม่ตรงกัน");return}
  busy(true);gerr("");
  sbReq("/auth/v1/signup",{method:"POST",json:1,auth:false,body:JSON.stringify({email:sbEmail(p),password:w,data:{first_name:fn,last_name:ln,phone:p}})}).then(function(j){
