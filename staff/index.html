function focusJob(id){var e=document.querySelector('[data-id="'+id+'"][data-a=job],[data-id="'+id+'"][data-a=fin]')||document.querySelector('[data-id="'+id+'"][data-a=ns]');if(e)e.focus()}

  ME.accepting=acc;ME.work_days=wd;if(!keep)ME.photo_path=o.photo;S.busy=false;draw()},function(e){S.busy=false;if(e&&e.status===401){doLogout();return}fail(errTh(e,"บันทึกไม่สำเร็จ"));throw e}).catch(function(){})}
function daysCard(){var w=ME.work_days||[];
 return'<div class="cal wd"><b>วันทำงานประจำสัปดาห์</b><p class="sub" style="margin:2px 0 8px">เลือกวันที่คุณทำงาน ลูกค้าจะจองคุณได้เฉพาะวันที่เลือก (ร้านที่สังกัดต้องเปิดวันนั้นด้วย)</p><div class="wdg" role="group" aria-label="เลือกวันทำงาน">'+DAYF.map(function(n,d){var on=w.indexOf(d)>-1;return'<button type="button" class="wdb'+(on?" on":"")+'" data-a="wd" data-d="'+d+'" aria-pressed="'+on+'" aria-label="วัน'+n+' '+(on?"ทำงาน":"หยุด")+'"><span>'+DAYS[d]+'</span><small>'+(on?"ทำงาน":"หยุด")+'</small></button>'}).join("")+'</div><div class="mini" style="display:flex;gap:6px;margin-top:8px"><button type="button" class="btn g" data-a="wdset" data-id="all" style="margin:0">ทุกวัน</button><button type="button" class="btn g" data-a="wdset" data-id="wk" style="margin:0">จันทร์-ศุกร์</button></div><p class="sub" id="wdsum" role="status" style="margin:8px 0 0">ทำงาน '+w.length+' วัน: '+w.map(function(d){return DAYS[d]}).join(" ")+(S.wdMsg?", "+esc(S.wdMsg):"")+'</p></div>'}
function ntView(){var L=feed(),f=S.ntf||"all",F=f==="all"?L:L.filter(function(x){return x.from===f}),cnt=function(k){return L.filter(function(x){return x.from===k}).length};
 return'<h1>การแจ้งเตือน</h1><p class="sub">ประกาศจากสมาคม และข้อความเกี่ยวกับคิวของคุณ (คิวใหม่ ยกเลิก เลื่อนคิว)</p><div class="nf" role="group" aria-label="กรองการแจ้งเตือน">'+[["all","ทั้งหมด ("+L.length+")"],["admin","จากสมาคม ("+cnt("admin")+")"],["booking","เกี่ยวกับคิว ("+cnt("booking")+")"]].map(function(x){return'<button type="button" data-a="ntf" data-id="'+x[0]+'" class="'+(f===x[0]?"on":"")+'" aria-pressed="'+(f===x[0])+'">'+x[1]+'</button>'}).join("")+'</div>'+
 (F.length?F.map(function(x){return'<div class="nti"><div class="qh"><b>'+esc(x.title)+'</b><span class="tag'+(x.from==="admin"?"":" w")+'">'+(x.from==="admin"?"สมาคม":"คิว")+'</span>'+(S.ntNew.indexOf(x.id)>-1?'<span class="tag w">ใหม่</span>':'')+'</div><small>'+ntAt(x.at)+'</small><pre>'+esc(x.text)+'</pre></div>'}).join(""):'<div class="empty">ยังไม่มีการแจ้งเตือน</div>')}
function banner(){return(S.ok?'<div class="okb" role="status">'+esc(S.ok)+'</div>':'')+(S.err?'<div class="toast" role="alert">'+esc(S.err)+'</div>':'')+(ME.accepting?'':'<div class="offb" role="status">ตอนนี้ปิดรับงานอยู่ ลูกค้าจะไม่เห็นคุณในการจองใหม่ (คิวที่จองไว้แล้วยังต้องให้บริการ) เปิดรับงานได้ที่สวิตช์ด้านบน</div>')}
function view(){var t=today(),h="";
 if(S.tab==="q"){
  var live=function(j){return j.active&&j.bstatus==="confirmed"&&(JRANK[j.job]||0)<3},
   fin=function(j){return!live(j)},
   cx=function(j){return j.bstatus==="cancelled"||j.bstatus==="rescheduled"||j.bstatus==="no_show"||!j.active},
   NEW=JOBS.filter(function(j){return live(j)&&j.job==="pending"}),
   WAIT=JOBS.filter(function(j){return live(j)&&(j.job==="accepted"||j.job==="in_progress")}),
   DONE=JOBS.filter(function(j){return fin(j)&&!cx(j)}),
   CXL=JOBS.filter(function(j){return fin(j)&&cx(j)}),
   asc=function(a,b){return a.starts_at<b.starts_at?-1:1},qt=S.qt||"new",
   TAB=[["new","งานใหม่",NEW],["wait","งานที่รออยู่",WAIT],["done","งานที่เสร็จสิ้น",DONE],["cx","งานถูกยกเลิก",CXL]],
   cur=(TAB.filter(function(x){return x[0]===qt})[0]||TAB[0]),
   nowI=new Date().toISOString(),ended=function(j){return j.ends_at<nowI},
   list=cur[2].slice().sort(cur[0]==="done"||cur[0]==="cx"?function(a,b){return asc(b,a)}:function(a,b){var ea=ended(a),eb=ended(b);return ea!==eb?(ea?1:-1):asc(a,b)}),
   EM={new:"ยังไม่มีงานใหม่ งานที่ลูกค้าจองเข้ามาจะขึ้นที่นี่ กดรับงานเพื่อย้ายไปที่ \"งานที่รออยู่\"",wait:"ไม่มีงานที่รออยู่ งานที่คุณรับแล้วและยังไม่เสร็จจะขึ้นที่นี่",done:"ยังไม่มีงานที่เสร็จสิ้น (แสดงย้อนหลัง 30 วัน)"},
   groups="",last=null,lateShown=false;
  EM.cx="ไม่มีงานที่ถูกยกเลิก (แสดงย้อนหลัง 30 วัน)";
  list.forEach(function(j){if(cur[0]!=="done"&&cur[0]!=="cx"&&ended(j)&&!lateShown){lateShown=true;last=null;groups+='<h2 style="margin-top:20px">เลยเวลานัดแล้ว</h2>'}var d=bkDate(Date.parse(j.starts_at));if(d!==last){last=d;groups+='<h3 style="margin:14px 0 6px;font-size:1rem">'+(d===t?"วันนี้, ":"")+thD(d)+'</h3>'}groups+=jobCard(j,false)});
  h=banner()+'<h1>คิวงาน</h1><p class="sub">'+esc(ME.place)+'</p><div class="nf" role="tablist" aria-label="หมวดคิวงาน">'+TAB.map(function(x){return'<button type="button" role="tab" data-a="qt" data-id="'+x[0]+'" class="'+(x[0]===cur[0]?"on":"")+'" aria-selected="'+(x[0]===cur[0])+'">'+x[1]+' ('+x[2].length+')</button>'}).join("")+'</div>'+
   (list.length?groups:'<div class="empty">'+EM[cur[0]]+'</div>')}
 if(S.tab==="sc"){h=banner()+'<h1>ตารางงาน</h1><p class="sub">'+esc(ME.place)+'</p>'+daysCard()+'<h2 style="margin-top:18px">7 วันข้างหน้า</h2>';
  for(var i=0;i<7;i++){var k=addDays(t,i),open=workOn(k),L2=mine(k),off=OFFS.indexOf(k)>-1;
   h+='<div class="day"><h2>'+(i===0?"วันนี้, ":i===1?"พรุ่งนี้, ":"")+thD(k)+'</h2>'+(!open?'<span class="mute">'+(off?"วันหยุดที่ร้านตั้งไว้":"วันหยุดของคุณ")+'</span>':(L2.length?L2.map(function(j){return'<div class="item"><b>'+rng(j)+'</b> '+esc(j.customer)+'<small class="mute" style="display:block">'+esc(j.service)+'</small></div>'}).join(""):'<span class="mute">ไม่มีคิว</span>'))+'</div>'}}
 if(S.tab==="ac")h=acView();
 if(S.tab==="nt")h=(S.err?'<div class="toast" role="alert">'+esc(S.err)+'</div>':'')+ntView();
 return h}
function draw(){if(!ME)return;
 if(S.chat&&document.getElementById("chl"))return;

}

document.addEventListener("click",function(e){
 var el=e.target.closest&&e.target.closest("[data-a]");if(!el||!ME)return;var a=el.dataset.a,id=el.dataset.id;
 if(a==="tab"){S.tab=id;S.err="";S.ok="";S.cfm=null;S.rvReply=null;if(id==="nt")openNt();if(id==="ac")rvLoad();draw();return}
 if(a==="rvreply"){S.rvReply=id;draw();var ta=document.getElementById("rvtxt");if(ta)ta.focus();return}
 if(a==="rvno"){S.rvReply=null;draw();return}

 if(a==="rvrep"){rvReport(id);return}
 if(a==="rvmore"){RV.show+=10;draw();return}
 if(a==="ntf"){S.ntf=id;draw();return}
 if(a==="qt"){S.qt=id;draw();return}

 if(a==="job"||a==="cfmok"){var it=JOBS.filter(function(j){return j.id===id})[0];if(!it)return;var kind=a==="job"?"job":S.cfm&&S.cfm.id===id?S.cfm.k:"";if(!kind)return;
  var okT=kind==="job"?(el.dataset.job==="accepted"?"รับงานแล้ว":"เริ่มงานแล้ว"):kind==="fin"?"เสร็จสิ้นงานแล้ว":"บันทึกว่าลูกค้าไม่มาแล้ว";
  S.busy=true;S.err="";S.ok="";draw();
  (kind==="ns"?rpc("staff_mark_no_show",{p_item:id}):rpc("set_job_status",{p_item:id,p_status:kind==="fin"?"done":el.dataset.job})).then(function(){S.busy=false;S.cfm=null;S.ok=okT+" "+it.customer;S.qt=kind==="ns"?"cx":kind==="fin"?"done":(el.dataset.job==="accepted"?"wait":S.qt);return loadAll()}).then(function(){draw();focusJob(id)},function(er){S.busy=false;S.cfm=null;if(er&&er.status===401){doLogout();return}fail(errTh(er,"อัปเดตงานไม่สำเร็จ"));loadAll().then(draw,function(){})});return}
 if(a==="wd"||a==="wdset"){var cur=(ME.work_days||[]).slice(),msg="";
  if(a==="wd"){var dn=+el.dataset.d,ix=cur.indexOf(dn);if(ix>-1){if(cur.length===1){msg="ต้องเลือกวันทำงานอย่างน้อย 1 วัน"}else{cur.splice(ix,1);var up=JOBS.filter(function(j){return j.active&&j.bstatus==="confirmed"&&dow(bkDate(Date.parse(j.starts_at)))===dn&&bkDate(Date.parse(j.starts_at))>=today()}).length;if(up)msg="วัน"+DAYF[dn]+"ยังมี "+up+" คิวที่จองไว้แล้ว ยังต้องให้บริการตามเดิม"}}else cur.push(dn)}
  else{cur=id==="all"?[0,1,2,3,4,5,6]:[1,2,3,4,5]}
  cur.sort(function(x,y){return x-y});S.wdMsg=msg;
  if(msg==="ต้องเลือกวันทำงานอย่างน้อย 1 วัน"){draw();return}
  saveSelf({wd:cur});return}
});
